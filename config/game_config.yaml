# AI Nations Game Configuration

game:
  num_players: 10
  initial_turn_number: 1
  auto_mode_delay_ms: 1000  # Delay between auto turns in milliseconds

eras:
  - name: "Era of Origin"
    index: 0
    unlocked_resources:
      - GOLD
      - WOOD
      - STONE
      - FOOD
    generation_multiplier: 1
    base_generation: 10

  - name: "Era of Structuring"
    index: 1
    unlocked_resources:
      - GOLD
      - WOOD
      - STONE
      - FOOD
      - TECHNOLOGY
    generation_multiplier: 10
    base_generation: 100

  - name: "Era of Information"
    index: 2
    unlocked_resources:
      - GOLD
      - WOOD
      - STONE
      - FOOD
      - TECHNOLOGY
      - INFORMATION
    generation_multiplier: 100
    base_generation: 1000

resources:
  GOLD:
    name: "Gold"
    symbol: "💰"
    color: "#FFD700"

  WOOD:
    name: "Wood"
    symbol: "🪵"
    color: "#8B4513"

  STONE:
    name: "Stone"
    symbol: "🪨"
    color: "#808080"

  FOOD:
    name: "Food"
    symbol: "🌾"
    color: "#F4A460"

  TECHNOLOGY:
    name: "Technology"
    symbol: "⚙️"
    color: "#4169E1"

  INFORMATION:
    name: "Information"
    symbol: "💾"
    color: "#9370DB"

generators:
  LUMBER_CAMP:
    name: "Lumber Camp"
    produces: WOOD
    base_cost:
      STONE: 10
    required_era: 0

  QUARRY:
    name: "Quarry"
    produces: STONE
    base_cost:
      WOOD: 10
    required_era: 0

  FARM:
    name: "Farm"
    produces: FOOD
    base_cost_any: 10  # Can pay with any single resource
    required_era: 0

  MINE:
    name: "Mine"
    produces: GOLD
    base_cost:
      STONE: 5
      WOOD: 5
    required_era: 0

  FACTORY:
    name: "Factory"
    produces: TECHNOLOGY
    base_cost:
      FOOD: 100
      GOLD: 100
    required_era: 1

  DATACENTER:
    name: "Datacenter"
    produces: INFORMATION
    base_cost:
      GOLD: 1000
      TECHNOLOGY: 200
    required_era: 2

# Progressive pricing: price = base_cost * (total_generators_of_type + 1)
pricing:
  use_progressive_pricing: true
  # Formula: current_price = base_price * (count_built + 1)

# Era advancement requirements
era_advancement:
  # Automatic advancement when player has these resources at turn start
  era_1_requirements:
    GOLD: 50
    WOOD: 50
    STONE: 50
    FOOD: 50

  era_2_requirements:
    GOLD: 500
    WOOD: 500
    STONE: 500
    FOOD: 500
    TECHNOLOGY: 200

diplomacy:
  initial_relationship: 0  # Neutral start
  successful_trade_bonus: 1
  failed_trade_penalty: -1
  relationship_min: -100
  relationship_max: 100

ai:
  provider: "deepseek"
  model: "deepseek-chat"
  api_key: "sk-a04c4cea20c944208807b6fa67aa706e"
  max_tokens: 500
  temperature: 0.7
  timeout_seconds: 30

  # Token optimization
  include_full_history: false  # Only include recent history
  max_history_entries: 10
  compress_game_state: true

nations:
  # Real countries to randomly assign
  pool:
    - name: "United States"
      flag: "🇺🇸"
    - name: "China"
      flag: "🇨🇳"
    - name: "Japan"
      flag: "🇯🇵"
    - name: "Germany"
      flag: "🇩🇪"
    - name: "United Kingdom"
      flag: "🇬🇧"
    - name: "France"
      flag: "🇫🇷"
    - name: "India"
      flag: "🇮🇳"
    - name: "Brazil"
      flag: "🇧🇷"
    - name: "Canada"
      flag: "🇨🇦"
    - name: "South Korea"
      flag: "🇰🇷"
    - name: "Australia"
      flag: "🇦🇺"
    - name: "Spain"
      flag: "🇪🇸"
    - name: "Mexico"
      flag: "🇲🇽"
    - name: "Italy"
      flag: "🇮🇹"
    - name: "Russia"
      flag: "🇷🇺"

ui:
  window_width: 1600
  window_height: 900
  fps: 60
  background_color: "#1a1a2e"

  colors:
    primary: "#0f3460"
    secondary: "#16213e"
    accent: "#e94560"
    text: "#f1f1f1"
    text_secondary: "#a0a0a0"
    success: "#2ecc71"
    warning: "#f39c12"
    error: "#e74c3c"

  fonts:
    main: null  # Will use pygame default
    size_small: 14
    size_medium: 18
    size_large: 24
    size_title: 36
