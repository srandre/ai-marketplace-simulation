# AI Nations Game Configuration

game:
  num_players: 10
  initial_turn_number: 1
  initial_era: 1  # Starting era for all players (0=Origin, 1=Structuring, 2=Information)
  auto_mode_delay_ms: 1000  # Delay between auto turns in milliseconds

eras:
  - name: "Era of Origin"
    index: 0
    unlocked_resources:
      - GOLD
      - WOOD
      - STONE
      - FOOD
    generation_multiplier: 1
    base_generation: 10

  - name: "Era of Structuring"
    index: 1
    unlocked_resources:
      - GOLD
      - WOOD
      - STONE
      - FOOD
      - TECHNOLOGY
    generation_multiplier: 10
    base_generation: 100

  - name: "Era of Information"
    index: 2
    unlocked_resources:
      - GOLD
      - WOOD
      - STONE
      - FOOD
      - TECHNOLOGY
      - INFORMATION
    generation_multiplier: 100
    base_generation: 1000

  - name: "Era of Domination"
    index: 3
    unlocked_resources:
      - GOLD
      - WOOD
      - STONE
      - FOOD
      - TECHNOLOGY
      - INFORMATION
    generation_multiplier: 1000
    base_generation: 10000

resources:
  GOLD:
    name: "Gold"
    symbol: "💰"
    color: "#FFD700"

  WOOD:
    name: "Wood"
    symbol: "🪵"
    color: "#8B4513"

  STONE:
    name: "Stone"
    symbol: "🪨"
    color: "#808080"

  FOOD:
    name: "Food"
    symbol: "🌾"
    color: "#F4A460"

  TECHNOLOGY:
    name: "Technology"
    symbol: "⚙️"
    color: "#4169E1"

  INFORMATION:
    name: "Information"
    symbol: "💾"
    color: "#9370DB"

generators:
  LUMBER_CAMP:
    name: "Lumber Camp"
    produces: WOOD
    base_cost:
      STONE: 10
    required_era: 0

  QUARRY:
    name: "Quarry"
    produces: STONE
    base_cost:
      WOOD: 10
    required_era: 0

  FARM:
    name: "Farm"
    produces: FOOD
    base_cost_either:
      WOOD: 10
      STONE: 10
    required_era: 0

  MINE:
    name: "Mine"
    produces: GOLD
    base_cost:
      STONE: 5
      WOOD: 5
    required_era: 0

  FACTORY:
    name: "Factory"
    produces: TECHNOLOGY
    base_cost:
      FOOD: 100
      GOLD: 100
    required_era: 1

  DATACENTER:
    name: "Datacenter"
    produces: INFORMATION
    base_cost:
      GOLD: 1000
      TECHNOLOGY: 200
    required_era: 2

# Era advancement requirements
era_advancement:
  # Automatic advancement when player has these resources at turn start
  era_1_requirements:
    GOLD: 50
    WOOD: 50
    STONE: 50
    FOOD: 50

  era_2_requirements:
    GOLD: 500
    WOOD: 500
    STONE: 500
    FOOD: 500
    TECHNOLOGY: 200

  era_3_requirements:
    GOLD: 50000
    WOOD: 50000
    STONE: 50000
    FOOD: 50000
    TECHNOLOGY: 20000
    INFORMATION: 10000

diplomacy:
  initial_relationship: 0  # Neutral start
  successful_trade_bonus: 1
  failed_trade_penalty: -1
  relationship_min: -100
  relationship_max: 100

ai:
  provider: "deepseek"
  model: "deepseek-chat"
  # API key is loaded from .env file (DEEPSEEK_API_KEY)
  max_tokens: 500
  temperature: 0.7
  timeout_seconds: 30

